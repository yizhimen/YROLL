[project]
name = "yroll"
version = "0.1.0"
description = "YROLL AI — AI-native video production environment (Phase 0: understanding spike)"
requires-python = ">=3.12"
dependencies = [
    "scenedetect[opencv-headless]>=0.6",
    "faster-whisper>=1.1",
    "openai>=1.50",
    "pydantic>=2.9",
    "pillow>=10.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yroll"]
